name: 每日涨停池与涨停原因同步

on:
  schedule:
    # 每个交易日（周一至周五）北京时间 15:30 (即 UTC 07:30) 自动触发
    - cron: '30 7 * * 1-5'
  workflow_dispatch: # 支持在 GitHub 网页 Actions 面板随时手动点击运行
  push:
    branches:
      - main
    paths:
      - '一键同步最新真实行情.py'
      - 'sync_limit_up.py'
      - 'limit-up.template.html'
      - '.github/workflows/auto_sync_market.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "market-sync"
  cancel-in-progress: false

jobs:
  sync-market:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出最新代码
        uses: actions/checkout@v4

      - name: 🐍 配置 Python 3.11 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取每日涨停池并生成复盘页面
        run: |
          python -m unittest discover -s tests -v
          python sync_limit_up.py

      - name: 💾 自动提交并推送最新数据
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add -- data/limit-up index.html 股票分析工作台.html 半导体股票分析/A股AI产业链全景图谱_低价精选.html
          if git diff --staged --quiet; then
            echo "📊 今日数据已是最新，无需重复提交。"
          else
            git commit -m "chore(data): 更新每日涨停池与涨停原因 [skip ci]"
            git push origin main
          fi
